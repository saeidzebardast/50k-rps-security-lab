lab.hardened=true

# Actuator is an internal API: its own port (not published by docker-compose),
# every endpoint off unless explicitly opted in.
management.server.port=9090
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health

# Smaller header budget and a shorter connection timeout.
# NOTE: Tomcat's connection-timeout is per read, not a total header deadline,
# so a client dripping one byte per second still holds the connection. The
# lab shows this; the real fix is an edge proxy with a total header timeout.
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=5s
