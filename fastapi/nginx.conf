# Edge in front of fastapi-hardened. Uvicorn has no header-read timeout and
# no body limit, so both live here (and the body cap again in the app).
worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;

  client_header_timeout 5s;      # whole header must arrive in 5 s (Slowloris)
  client_body_timeout   5s;
  send_timeout          10s;
  keepalive_timeout     30s;
  client_max_body_size  64k;     # 413 before the app sees a byte
  large_client_header_buffers 4 8k;

  upstream app {
    server fastapi-hardened-app:8000;
    keepalive 64;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite, never append: whatever X-Forwarded-For the client sent is gone.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 1s;
      proxy_read_timeout    5s;
    }
  }
}
